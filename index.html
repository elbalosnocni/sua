<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tra cứu sữa chưa nhận</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      padding: 15px;
      background: #f5f6fa;
    }

    h2 {
      text-align: center;
    }

    input {
      padding: 12px;
      width: 100%;
      max-width: 400px;
      display: block;
      margin: 10px auto;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 12px;
      margin: 10px auto;
      max-width: 400px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .loading {
      text-align: center;
      color: #888;
      margin-top: 20px;
    }

    .highlight {
      background: yellow;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      input {
        font-size: 18px;
      }

      .card {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

<h2>🔍 Tra cứu sữa chưa nhận</h2>

 // thêm ảnh QR 
<div style="text-align:center; margin-top:10px;">
  <p>📱 Quét QR để truy cập nhanh</p>
  <img 
    src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://elbalosnocni.github.io/sua/" 
    alt="QR Code"
  >
</div>  

<input type="text" id="search" placeholder="Nhập tên hoặc mã NV" onkeyup="search()">

<div id="result"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzaA5c9l0s4X1FUaFasiY31B7fF4sFjpLM1WK8QeTH54zpjytVXUdK7klAjUPxlLXw-1g/exec";

// bỏ dấu
function removeVietnameseTones(str) {
  return str
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d")
    .replace(/Đ/g, "D")
    .toLowerCase();
}

// highlight text
function highlight(text, keyword) {
  if (!keyword) return text;

  const regex = new RegExp(`(${keyword})`, "gi");
  return text.replace(regex, '<span class="highlight">$1</span>');
}

function search() {
  const input = document.getElementById("search").value;
  const q = removeVietnameseTones(input);
  const div = document.getElementById("result");

  if (!q) {
    div.innerHTML = "";
    return;
  }

  // loading
  div.innerHTML = `<div class="loading">⏳ Đang tìm...</div>`;

  fetch(API + "?q=" + encodeURIComponent(q))
    .then(res => res.json())
    .then(data => {
      div.innerHTML = "";

      if (data.length === 0) {
        div.innerHTML = "❌ Không tìm thấy";
        return;
      }

      data.forEach(item => {
        div.innerHTML += `
          <div class="card">
            <b>${highlight(item.ten, input)}</b><br>
            Mã NV: ${highlight(item.ma, input)}<br>
            Số hộp: ${item.soHop}<br>
            Tháng chưa nhận: ${item.thang}<br>
            Phòng: ${item.phong}
          </div>
        `;
      });
    });
}
</script>

</body>
</html>
